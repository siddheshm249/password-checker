<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Strength Checker</title>
<style>
  body { font-family: system-ui, sans-serif; background:#f4f7fb; display:flex; justify-content:center; padding:40px 16px; }
  .card { background:#fff; padding:24px; border-radius:12px; width:100%; max-width:420px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
  input { width:100%; padding:10px; font-size:1rem; box-sizing:border-box; }
  .bar { height:10px; background:#e2e8f0; border-radius:5px; margin-top:12px; overflow:hidden; }
  #fill { height:100%; width:0; transition:width .2s; }
  #label { font-weight:700; margin-top:8px; }
  small { color:#5b6b7c; }
</style>
</head>
<body>
<div class="card">
  <h1>🔐 Password Strength Checker</h1>
  <input id="pw" type="text" placeholder="Type a password to test" autocomplete="off">
  <div class="bar"><div id="fill"></div></div>
  <p id="label">Strength: -</p>
  <small>Checked in your browser only. Nothing is sent anywhere.</small>
</div>
<script src="strength.js"></script>
<script>
  const colors = ['#dc2626', '#dc2626', '#f59e0b', '#84cc16', '#16a34a', '#16a34a'];
  document.getElementById('pw').addEventListener('input', (e) => {
    const s = Strength.score(e.target.value);
    const empty = e.target.value === '';
    document.getElementById('fill').style.width = empty ? '0' : (s / 5 * 100) + '%';
    document.getElementById('fill').style.background = colors[s];
    document.getElementById('label').textContent = 'Strength: ' + (empty ? '-' : Strength.label(s));
  });
</script>
</body>
</html>
